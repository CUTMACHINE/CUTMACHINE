# .github/workflows/ctest.yml
#
# headless-linux     sous Ubuntu, le moteur sans fenêtre (headless/), puis
#                    toutes les suites qui se passent de code Apple, à
#                    chaque PR vers main et à chaque push sur main
# all-tests-passed   échoue si un job qui devait tourner n'a pas réussi :
#                    le seul statut à exiger par une règle de protection
#                    de branche
#
# La suite complète, fenêtre comprise, ne tourne que sur macOS : voir
# « Build et tests » dans README.md.

name: CTest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -----------------------------------------------------------------------
  # Job Linux : le moteur, la ligne de commande et le serveur MCP sans
  # fenêtre (headless/, HEADLESS-2026-10), et toutes les suites qui se
  # passent de code Apple, la garde de l'architecture comprise. C'est le
  # seul job qui compile : ccache le tient court d'un passage à l'autre. Il
  # ne voit ni la fenêtre, ni Metal, ni le rendu des légendes et du motion
  # (Core Text), ni VideoToolbox.
  # -----------------------------------------------------------------------
  headless-linux:
    name: Build & CTest (Linux, sans fenêtre)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang ccache pkg-config ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswresample-dev libswscale-dev libsqlite3-dev libssl-dev \
            libyaml-cpp-dev libexpat1-dev libimath-dev libpystring-dev \
            zlib1g-dev
          ffmpeg -version | head -1

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-headless-linux-${{ github.sha }}
          restore-keys: |
            ccache-headless-linux-

      - name: Configure CMake
        run: |
          cmake -S headless -B build-headless -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=ON \
            -DHEADLESS_ALL_SUITES=ON

      - name: Build
        run: |
          cmake --build build-headless --parallel $(nproc)
          ccache --show-stats

      - name: Run CTest
        run: |
          ctest --test-dir build-headless \
            --output-on-failure \
            --timeout 300 \
            --parallel 4

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-results-headless-linux
          path: build-headless/Testing/
          retention-days: 7

  # -----------------------------------------------------------------------
  # Résumé de statut -- ce job est la "required status check" à configurer
  # dans les branch protection rules de GitHub.
  # Avantage : un seul check à surveiller, même si les jobs évoluent.
  # Un job que l'événement n'appelle pas sort « skipped » : il ne compte
  # pas. Un job annulé ou refusé, si.
  # -----------------------------------------------------------------------
  all-tests-passed:
    name: All tests passed
    needs: [headless-linux]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          failed=0
          check() {
            if [[ "$2" != "success" && "$2" != "skipped" ]]; then
              echo "::error::Le job '$1' n'a pas réussi ($2)"
              failed=1
            fi
          }
          check headless-linux "${{ needs.headless-linux.result }}"
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          echo "Tous les jobs appelés par cet événement passent."
