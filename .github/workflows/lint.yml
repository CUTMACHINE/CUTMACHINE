name: lint

# clang-tidy n'a pas de job : il demande le build macOS, que les minutes
# gratuites ne paient pas. Il se lance à la main avant de rendre.
on:
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check formatting of changed files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch origin "$BASE_SHA" --depth=1
          files=()
          while IFS= read -r f; do
            files+=("$f")
          done < <(git diff --name-only --diff-filter=ACMR \
            "$BASE_SHA"...HEAD -- '*.cc' '*.h' '*.mm')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed C/C++/Obj-C++ files."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          clang-format-18 -i -style=file "${files[@]}"
          git diff --exit-code -- "${files[@]}"
